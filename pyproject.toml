[project]
name = "enterprise-rag"
version = "0.1.0"
description = "fast track learning enterprise RAG structure"
readme = "README.md"
authors = [
    { name = "ham144", email = "24434muhammad.yafizham@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dev = "enterprise_rag.main:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
